# Static game only. No build step, no functions.
# The MCP server (mcp_server/, Python) is NOT deployed with this site.
[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/"
  to = "/visual/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://127.0.0.1:8067 http://localhost:8067"
