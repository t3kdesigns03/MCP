<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CLIDK-style Lab V1 — Hackers Visual POC</title>
  <style>
    body {
      margin: 0;
      background: #0a0a12;
      color: #00ff9f;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #canvas-container {
      position: relative;
      width: 100vw;
      height: 70vh;
      background: radial-gradient(ellipse at center, #111122 0%, #000 80%);
      border-bottom: 2px solid #00ff9f;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #terminal {
      height: 30vh;
      background: #000;
      border-top: 1px solid #00ff9f;
      padding: 10px;
      overflow-y: auto;
      font-size: 14px;
    }
    .prompt { color: #00ff9f; }
    .output { color: #aaffcc; }
    .error { color: #ff4466; }
    .help { color: #ffff66; }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      padding: 8px 12px;
      border: 1px solid #00ff9f;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="lab-canvas"></canvas>
    <div id="hud">HACKERS LAB V1 — Drag nodes · Double-click to inspect · Terminal below</div>
  </div>
  <div id="terminal">
    <div class="prompt">lab@kernel:~$ </div>
  </div>

  <script>
    const canvas = document.getElementById('lab-canvas');
    const ctx = canvas.getContext('2d');
    const terminal = document.getElementById('terminal');

    function resize() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      draw();
    }
    window.addEventListener('resize', resize);
    resize();

    // Simple nodes with classic-style labels (icons would be loaded here)
    let nodes = [
      { id: 'pc1', x: 200, y: 150, label: 'PC-01', type: 'computer', color: '#00ff9f' },
      { id: 'sw1', x: 450, y: 120, label: 'SW-CORE', type: 'switch', color: '#00ccff' },
      { id: 'rtr1', x: 700, y: 180, label: 'RTR-EDGE', type: 'router', color: '#ffaa00' },
      { id: 'srv1', x: 450, y: 320, label: 'SRV-MAIL', type: 'server', color: '#ff66cc' }
    ];
    let edges = [
      ['pc1', 'sw1'],
      ['sw1', 'rtr1'],
      ['sw1', 'srv1']
    ];

    let dragging = null;
    let offset = { x: 0, y: 0 };

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Subtle grid / scanlines vibe
      ctx.strokeStyle = 'rgba(0,255,159,0.05)';
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }

      // Edges
      ctx.strokeStyle = '#00ff9f';
      ctx.lineWidth = 2;
      edges.forEach(([a, b]) => {
        const na = nodes.find(n => n.id === a);
        const nb = nodes.find(n => n.id === b);
        if (na && nb) {
          ctx.beginPath();
          ctx.moveTo(na.x, na.y);
          ctx.lineTo(nb.x, nb.y);
          ctx.stroke();
        }
      });

      // Nodes (classic icon placeholders — square + label for now)
      nodes.forEach(n => {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.strokeStyle = n.color;
        ctx.lineWidth = 2;
        ctx.fillRect(n.x - 40, n.y - 30, 80, 60);
        ctx.strokeRect(n.x - 40, n.y - 30, 80, 60);
        ctx.fillStyle = n.color;
        ctx.font = '12px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(n.label, n.x, n.y + 5);
        ctx.font = '10px Courier New';
        ctx.fillText(n.type, n.x, n.y + 20);
      });
    }

    canvas.addEventListener('mousedown', e => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      dragging = nodes.find(n => Math.abs(n.x - mx) < 40 && Math.abs(n.y - my) < 30);
      if (dragging) {
        offset.x = mx - dragging.x;
        offset.y = my - dragging.y;
      }
    });
    canvas.addEventListener('mousemove', e => {
      if (!dragging) return;
      const rect = canvas.getBoundingClientRect();
      dragging.x = e.clientX - rect.left - offset.x;
      dragging.y = e.clientY - rect.top - offset.y;
      draw();
    });
    canvas.addEventListener('mouseup', () => dragging = null);
    canvas.addEventListener('dblclick', e => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const node = nodes.find(n => Math.abs(n.x - mx) < 40 && Math.abs(n.y - my) < 30);
      if (node) {
        appendOutput(`Inspecting ${node.label} (${node.type}) — state: online`);
      }
    });

    // Terminal
    let history = [];
    let historyIndex = -1;

    function appendOutput(text, cls = 'output') {
      const div = document.createElement('div');
      div.className = cls;
      div.textContent = text;
      terminal.appendChild(div);
      terminal.scrollTop = terminal.scrollHeight;
    }

    function handleCommand(cmd) {
      const lower = cmd.trim().toLowerCase();
      if (!lower) return;

      history.push(cmd);
      historyIndex = history.length;

      if (lower === 'help' || lower === '?' || lower === 'help?') {
        appendOutput('Available commands:', 'help');
        appendOutput('  help / ?          — this message', 'help');
        appendOutput('  packages / pkg    — list available packages', 'help');
        appendOutput('  ansible-galaxy    — Ansible Galaxy info', 'help');
        appendOutput('  nodes             — list topology nodes', 'help');
        appendOutput('  clear             — clear terminal', 'help');
        appendOutput('  version           — lab version', 'help');
        return;
      }
      if (lower === 'packages' || lower === 'pkg' || lower === 'packages list') {
        appendOutput('Kernel packages available (simulated):', 'output');
        appendOutput('  ansible  (latest)   — automation', 'output');
        appendOutput('  ansible-galaxy      — collection manager', 'output');
        appendOutput('  netmiko             — network device SSH', 'output');
        appendOutput('  napalm              — network automation', 'output');
        appendOutput('  pysnmp              — SNMP', 'output');
        appendOutput('  requests            — HTTP', 'output');
        appendOutput('  rich                — terminal UI', 'output');
        appendOutput('  ... full set available in real kernel', 'output');
        return;
      }
      if (lower.startsWith('ansible-galaxy')) {
        appendOutput('ansible-galaxy 2.17+ (simulated latest)', 'output');
        appendOutput('  ansible-galaxy collection install community.network', 'output');
        appendOutput('  ansible-galaxy role install geerlingguy.docker', 'output');
        appendOutput('Collections and roles available. Use in playbooks.', 'output');
        return;
      }
      if (lower === 'nodes') {
        nodes.forEach(n => appendOutput(`${n.id.padEnd(8)} ${n.label.padEnd(12)} ${n.type}`));
        return;
      }
      if (lower === 'clear') {
        terminal.innerHTML = '<div class="prompt">lab@kernel:~$ </div>';
        return;
      }
      if (lower === 'version') {
        appendOutput('CLIDK Lab Kernel V1.0 — Hackers visual + MCP-ready', 'output');
        return;
      }
      appendOutput(`Command not found: ${cmd}. Type help or ?`, 'error');
    }

    // Simple input handling
    let currentInput = '';
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'Enter') {
        const line = document.createElement('div');
        line.className = 'prompt';
        line.textContent = 'lab@kernel:~$ ' + currentInput;
        terminal.appendChild(line);
        handleCommand(currentInput);
        currentInput = '';
        terminal.scrollTop = terminal.scrollHeight;
      } else if (e.key === 'Backspace') {
        currentInput = currentInput.slice(0, -1);
      } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
        currentInput += e.key;
      }
      // Update last prompt visually (simple approach)
      const prompts = terminal.querySelectorAll('.prompt');
      if (prompts.length) {
        prompts[prompts.length - 1].textContent = 'lab@kernel:~$ ' + currentInput;
      }
    });

    draw();
    appendOutput('Lab kernel ready. Type help or ? for commands.', 'help');
  </script>
</body>
</html>
