<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#05050c">
  <meta name="description" content="Agent0067: learn MCP by building a Python MCP server in front of five simulated network systems. Everything is fictional.">
  <title>Agent0067 — Build the MCP Server</title>
  <link rel="icon" href="../assets/icons/server.png">
  <link rel="stylesheet" href="css/app.css?v=7">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand" title="Agent0067">AGENT<b>0067</b></div>
    <nav id="phasebar" aria-label="Phases"></nav>
    <div class="top-actions">
      <button id="btn-systems" class="btn" title="Open the five simulated systems">SYSTEMS</button>
      <button id="btn-free" class="btn" aria-pressed="false" title="Free Play: build without grading">FREE</button>
      <button id="btn-menu" class="btn icon" aria-haspopup="true" aria-label="Menu">&#9776;</button>
    </div>
    <div id="menu" class="menu" hidden>
      <button data-act="crt">CRT scanlines: <span id="crt-state">on</span></button>
      <button data-act="export">Export lab_state.json</button>
      <button data-act="bridge">Local server bridge…</button>
      <button data-act="reset-lab">Reset lab (keep progress)</button>
      <button data-act="reset-all">Reset everything</button>
      <div class="menu-note">All systems, data and keys are FICTIONAL. Nothing leaves this page unless you start the local Python server yourself.</div>
    </div>
  </header>

  <main id="stage">
    <section id="map" aria-label="Topology map">
      <canvas id="lab-canvas" aria-label="Network topology canvas"></canvas>
      <div id="palette" role="toolbar" aria-label="Device palette"></div>
      <div id="map-tools">
        <button id="tool-cable" class="btn small" aria-pressed="false" title="Cable mode: drag from one device to another">CABLE</button>
        <button id="tool-fit" class="btn small" title="Fit topology to view">FIT</button>
      </div>
      <div id="hud"></div>
      <div id="map-empty">Drag a device from the palette onto the grid<br><small>(or tap one, then tap the grid)</small></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </section>

    <div id="lower-tabs" role="tablist">
      <button role="tab" data-pane="term" aria-selected="true">TERMINAL</button>
      <button role="tab" data-pane="guide" aria-selected="false">GUIDE <span id="obj-count"></span></button>
      <button role="tab" data-pane="verify" aria-selected="false">VERIFY</button>
    </div>

    <aside id="side">
      <div id="side-tabs" role="tablist">
        <button role="tab" data-side="guide" aria-selected="true">GUIDE</button>
        <button role="tab" data-side="verify" aria-selected="false">VERIFY</button>
      </div>
      <div id="guide" class="pane"></div>
      <div id="verify" class="pane" hidden></div>
    </aside>

    <section id="term" aria-label="Terminal">
      <div id="term-tabs"></div>
      <div id="term-out" role="log" aria-live="polite"></div>
      <form id="term-form" autocomplete="off">
        <label id="prompt" for="term-in"></label>
        <input id="term-in" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Terminal input">
        <button type="button" id="btn-tab" class="btn small" title="Complete (TAB)">TAB</button>
        <button type="button" id="btn-hist" class="btn small" title="Previous command">&uarr;</button>
      </form>
    </section>
  </main>

  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-card">
      <div class="sheet-head"><span id="sheet-title"></span><button class="btn small" id="sheet-close" aria-label="Close">CLOSE</button></div>
      <div id="sheet-tabs"></div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="brief" class="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-card brief-card">
      <div id="brief-body"></div>
      <div class="brief-actions"><button class="btn primary" id="brief-go">START</button></div>
    </div>
  </div>

  <div id="boot-error" hidden></div>
</div>

<script src="js/tools.js?v=7"></script>
<script src="js/state.js?v=7"></script>
<script src="js/canvas.js?v=7"></script>
<script src="js/panels.js?v=7"></script>
<script src="js/phases.js?v=7"></script>
<script src="js/terminal.js?v=7"></script>
<script src="js/app.js?v=7"></script>
</body>
</html>
